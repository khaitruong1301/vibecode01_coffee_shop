# CD CoffeePOS — deploy THỦ CÔNG: Actions → Deploy → Run workflow (hoặc `gh workflow run deploy.yml -f ref=main`).
# Push lên main chỉ chạy CI, không tự deploy. Mặc định chỉ cho deploy commit đã có CI xanh.
# Image backend + frontend được BUILD TRÊN GITHUB ACTIONS rồi đẩy lên GHCR (ghcr.io/<owner>/<repo>-backend|frontend:<sha>);
# server chỉ pull image và chạy docker-compose.yml với .env production (xem scripts/deploy.sh) — không build trên server.
# DB và API chỉ nghe trên 127.0.0.1, chỉ web (FRONTEND_PORT) mở ra Internet.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS  — kết nối server
#   JWT_SECRET (≥ 32 ký tự), DB_PASSWORD                   — ghi vào .env trên server
#   SEED_PASSWORD   — mật khẩu cho tài khoản seed; BẮT BUỘC khi SEED=true (không dùng mật khẩu demo công khai)
#   SEPAY_WEBHOOK_KEY — (tuỳ chọn) API key webhook SePay, ≥ 24 ký tự; bỏ trống = webhook tắt
#     (DB_PASSWORD chỉ có hiệu lực khi volume DB tạo lần đầu — đổi sau đó phải đổi cả trong Postgres)
# Variables (tuỳ chọn): FRONTEND_PORT (mặc định 3100), SEED (mặc định true), DEPLOY_URL (link hiển thị),
#   COOKIE_SECURE (true khi web chạy HTTPS → cookie Secure + HSTS), SWAGGER_ENABLED (mặc định tắt trên production),
#   SEPAY_BANK, SEPAY_ACCOUNT_NO, SEPAY_ACCOUNT_NAME (tài khoản nhận chuyển khoản — thiếu thì không bật chuyển khoản)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag hoặc commit SHA cần deploy (rollback = nhập commit cũ)
        default: main
        required: true
      skip_ci_check:
        description: Bỏ qua kiểm tra CI xanh (chỉ dùng khi khẩn cấp)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read    # đọc kết quả CI của commit
  packages: write  # đẩy image lên GHCR; server dùng token của run để pull

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build image (GitHub Actions → GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Xác định commit + kiểm tra CI
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP: ${{ inputs.skip_ci_check }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Deploy ${{ inputs.ref }} → $(git log -1 --format='%h %s')"
          if [ "$SKIP" = "true" ]; then
            echo "::warning::Bỏ qua kiểm tra CI theo yêu cầu"
          else
            OK=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq length)
            if [ "$OK" -eq 0 ]; then
              echo "::error::Commit ${SHA::7} chưa có lần chạy CI thành công — chờ CI xanh hoặc chọn skip_ci_check"; exit 1
            fi
            echo "CI đã xanh cho ${SHA::7}"
          fi
          # Tên image trên GHCR phải viết thường
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "sha=$SHA"
            echo "backend_image=$BASE-backend:$SHA"
            echo "frontend_image=$BASE-frontend:$SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          # Giống build args trong docker-compose.yml
          build-args: |
            BACKEND_URL=http://backend:4100
            ENABLE_HSTS=${{ vars.COOKIE_SECURE || 'false' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy lên server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Cấu hình SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Ghi .env + token pull image trên server
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE || 'false' }}
          SWAGGER_ENABLED: ${{ vars.SWAGGER_ENABLED || 'false' }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '3100' }}
          SEED: ${{ vars.SEED || 'true' }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          GHCR_TOKEN: ${{ github.token }}
          SEPAY_WEBHOOK_KEY: ${{ secrets.SEPAY_WEBHOOK_KEY }}
          SEPAY_BANK: ${{ vars.SEPAY_BANK }}
          SEPAY_ACCOUNT_NO: ${{ vars.SEPAY_ACCOUNT_NO }}
          SEPAY_ACCOUNT_NAME: ${{ vars.SEPAY_ACCOUNT_NAME }}
        run: |
          test -n "$JWT_SECRET" && test -n "$DB_PASSWORD" || { echo "Thiếu secret JWT_SECRET / DB_PASSWORD"; exit 1; }
          [ "${#JWT_SECRET}" -ge 32 ] || { echo "JWT_SECRET phải dài tối thiểu 32 ký tự"; exit 1; }
          if [ -n "$SEPAY_WEBHOOK_KEY" ] && [ "${#SEPAY_WEBHOOK_KEY}" -lt 24 ]; then
            echo "SEPAY_WEBHOOK_KEY phải dài tối thiểu 24 ký tự"; exit 1
          fi
          if [ "$SEED" = "true" ] && [ -z "$SEED_PASSWORD" ]; then
            echo "SEED=true cần secret SEED_PASSWORD — không seed tài khoản bằng mật khẩu demo công khai"; exit 1
          fi
          {
            echo "JWT_SECRET=\"$JWT_SECRET\""
            echo "DB_PASSWORD=\"$DB_PASSWORD\""
            echo "APP_ENV=production"
            echo "SEED=$SEED"
            echo "SEED_PASSWORD=\"$SEED_PASSWORD\""
            echo "COOKIE_SECURE=$COOKIE_SECURE"
            echo "SWAGGER_ENABLED=$SWAGGER_ENABLED"
            echo "FRONTEND_PORT=$FRONTEND_PORT"
            echo "BACKEND_PORT=4100"
            echo "DB_BIND=127.0.0.1"
            echo "BACKEND_BIND=127.0.0.1"
            echo "CORS_ORIGIN=\"${DEPLOY_URL:-http://localhost:$FRONTEND_PORT}\""
            echo "BACKEND_IMAGE=$BACKEND_IMAGE"
            echo "FRONTEND_IMAGE=$FRONTEND_IMAGE"
            echo "SEPAY_WEBHOOK_KEY=\"$SEPAY_WEBHOOK_KEY\""
            echo "SEPAY_BANK=\"$SEPAY_BANK\""
            echo "SEPAY_ACCOUNT_NO=\"$SEPAY_ACCOUNT_NO\""
            echo "SEPAY_ACCOUNT_NAME=\"$SEPAY_ACCOUNT_NAME\""
          } | ssh server 'umask 077 && mkdir -p /opt/coffeepos && cat > /opt/coffeepos/.env'
          # Token của run (hết hạn khi job xong) — deploy.sh dùng để pull image GHCR rồi xoá ngay
          printf '%s' "$GHCR_TOKEN" | ssh server 'umask 077 && cat > /opt/coffeepos/.ghcr-token'

      - name: Deploy (git fetch → docker compose pull → up → health check)
        run: ssh server "bash -s -- https://github.com/${{ github.repository }}.git $SHA ${{ github.actor }}" < scripts/deploy.sh

      - name: Tóm tắt
        if: always()
        run: |
          echo "### Deploy \`${SHA::7}\` (${{ inputs.ref }}) — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ needs.build.outputs.backend_image }}\`, \`${{ needs.build.outputs.frontend_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          [ -n "${{ vars.DEPLOY_URL }}" ] && echo "Web: ${{ vars.DEPLOY_URL }}" >> "$GITHUB_STEP_SUMMARY" || true
